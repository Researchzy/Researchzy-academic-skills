name: researchzy-thesis-proposal
version: 1.0.0
description: >
  Write a thesis proposal or a doctoral research proposal to the school's own
  template: a record of the template's sections, limits and required items
  with quotes checked against the files, questions the student chooses, a
  literature ledger of papers found and read, a design matrix with a row per
  question, a feasibility plan and timeline, and a script that checks the
  draft against all of them.

always_load:
  - SKILL.md

references:
  on_demand:
    - condition: reading the school's template and rules, writing template.json, recording limits or conflicts, or acting on the template check
      path: references/template-record.md
    - condition: offering candidate questions, recording the chosen ones, writing matrix.csv, or comparing designs
      path: references/questions-and-design.md
    - condition: writing brief.json, the minimum executable version, waits, timeline.csv, or acting on the timeline check
      path: references/feasibility-and-timeline.md
    - condition: building the literature basis in the ledger, wording gaps, expected and pilot results, the manual rows of the check, or exporting
      path: references/writing.md
    - condition: checking the record's quotes against the school's files, the draft against the record, ledger and tables, or the timeline
      path: scripts/proposal_check.py
    - condition: logging searches, adding, deciding and reading papers, exporting references.bib
      path: scripts/review_ledger.py
interface:
  display_name: "Researchzy Thesis Proposal"
  short_description: "Write and check a thesis proposal to the school's own template"
  default_prompt: "Use $researchzy-thesis-proposal to write my thesis proposal from my school's template."
